<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandleScout</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--fg:#1a1d21;--mut:#6b7280;--line:#e5e7eb;--acc:#f43f5e;--ok:#15803d;--okbg:#dcfce7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--fg:#e8eaed;--mut:#9aa1ad;--line:#262b33;--acc:#fb7185;--ok:#4ade80;--okbg:#14301f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--line);color:var(--mut);display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
.m{flex:1;min-width:0}.n{font-weight:600}.s{color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.found{background:var(--okbg);color:var(--ok)}.free,.unk{color:var(--mut)}
.row.dim{padding-block:9px}.row.dim .av{width:28px;height:28px;font-size:12px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.btn{border:0;background:var(--acc);color:#fff;font:600 14px system-ui;padding:10px;border-radius:8px;width:100%;cursor:pointer}
.btn.o{background:none;border:1px solid var(--line);color:var(--fg);width:auto;padding:6px 10px;font-size:12px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:8px 0}
aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}aside .card{padding:14px}
h3{margin:0 0 4px;font-size:13px}.var{display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:12.5px}
.hd{padding:12px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:600}.hd span{color:var(--mut);font-weight:400}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
</style></head><body>
<div class="wrap">
<main id="out" class="card"><div class="empty">Enter a username and press Search.</div></main>
<aside>
 <div class="card"><h3>Search username</h3>
  <input id="u" placeholder="Enter a username" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="btn" id="go">Search</button></div>
 <div class="card" id="vbox" hidden><h3>Try a variation:</h3><div id="vars"></div></div>
 <div class="card"><h3>Privacy</h3><div class="s" style="white-space:normal">Searches run on your own server and are not stored. Only public profile pages are read.</div></div>
</aside></div>
<script>
const $=id=>document.getElementById(id);
let results=[],cur='';
const ord={found:0,unk:1,free:2};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function variations(h){
  const v=new Set([h.replace(/\d+/g,''),h.replace(/[._-]/g,''),h+'_',h.replace(/\d+$/,'')]);
  v.delete(h);v.delete('');return [...v].filter(x=>x.length>=2).slice(0,4);
}
function render(done){
  const sorted=[...results].sort((a,b)=>ord[a.status==='unknown'?'unk':a.status]-ord[b.status==='unknown'?'unk':b.status]);
  const found=sorted.filter(r=>r.status==='found').length;
  let html=`<div class="hd">Results for @${esc(cur)}<span>${found} profiles found${done?'':' · scanning '+results.length+'/39…'}</span></div>`;
  for(const r of sorted){
    const l=r.name[0],cls=r.status==='found'?'':'dim';
    const av=r.pic?`<img class="av" src="${esc(r.pic)}" referrerpolicy="no-referrer" alt="" onerror="this.outerHTML='<div class=&quot;av&quot;>${l}</div>'">`:`<div class="av">${l}</div>`;
    let right;
    if(r.status==='found')right=`<span class="tag found">Profile found</span> <a class="btn o" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">View</a>`;
    else if(r.status==='free')right=`<span class="tag free">Not taken</span>`;
    else right=`<span class="tag unk">Unknown</span> <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Check manually →</a>`;
    html+=`<div class="row ${cls}">${av}<div class="m"><div class="n">${esc(r.name)}</div>${r.status==='found'&&r.title?`<div class="s">${esc(r.title)}</div>`:''}</div>${right}</div>`;
  }
  $('out').innerHTML=html;
}
async function scan(h){
  h=h.trim().replace(/^@+/,'');
  if(!/^[A-Za-z0-9._-]{1,40}$/.test(h)){$('out').innerHTML='<div class="empty">Use 1–40 letters, numbers, . _ or -</div>';return}
  cur=h;results=[];$('u').value=h;render(false);
  const vs=variations(h);$('vbox').hidden=!vs.length;
  $('vars').innerHTML=vs.map(v=>`<span class="var" data-v="${esc(v)}">${esc(v)}</span>`).join('');
  try{
    const res=await fetch('api.php?u='+encodeURIComponent(h));
    if(!res.ok)throw 0;
    results=await res.json();render(true);
  }catch(e){$('out').innerHTML='<div class="empty">Could not reach api.php. Make sure api.php is uploaded in the same folder as index.html.</div>'}
}
$('go').onclick=()=>scan($('u').value);
$('u').addEventListener('keydown',e=>{if(e.key==='Enter')scan($('u').value)});
$('vars').onclick=e=>{if(e.target.dataset.v)scan(e.target.dataset.v)};
</script></body></html>
